<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Timezone Switcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="status" class="status status-off">
    <span id="status-dot" class="status-dot"></span>
    <span id="status-text">Off - using system timezone</span>
  </div>

  <label for="country">Country</label>
  <div class="combobox">
    <input id="country" placeholder="Search country..." autocomplete="off" />
    <div id="country-dropdown" class="dropdown-list hidden"></div>
  </div>

  <label for="timezone">Timezone</label>
  <select id="timezone" disabled></select>

  <div class="actions">
    <button id="apply" disabled>Apply</button>
    <button id="reset" class="secondary">Reset to system timezone</button>
  </div>

  <div class="info-box">
    <p class="info-text">
      Applies to this tab only and reloads it. Web workers inside the page
      still see your real timezone.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
